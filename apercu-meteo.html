<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Icônes météo animées</title><style>body{font:20px system-ui;background:#f4f6fb;color:#0b1e45;padding:24px;margin:0}.row{display:flex;align-items:center;gap:16px;margin:10px 0;background:#fff;padding:14px 18px;border-radius:16px;box-shadow:0 6px 18px rgba(11,30,69,.08)}b{width:130px}.ic{font-size:20px;line-height:1}.wxi{width:1.5em;height:1.5em;vertical-align:-.35em;display:inline-block}
#hfCdWx .wxi{width:1.85em;height:1.85em;vertical-align:-.5em}
#hfCdWx{font-size:1.05em}
.wxi line,.wxi circle,.wxi path{stroke-linecap:round;stroke-linejoin:round}
@keyframes wxspin{to{transform:rotate(360deg)}}
.wx-spin{transform-origin:12px 12px;animation:wxspin 9s linear infinite}
.wx-spin2{transform-origin:8.5px 8px;animation:wxspin 9s linear infinite}
@keyframes wxdrop{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(5px);opacity:0}}
.wx-drop{animation:wxdrop 1.05s linear infinite}.wx-drop.d2{animation-delay:.34s}.wx-drop.d3{animation-delay:.68s}
@keyframes wxflake{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(5px);opacity:0}}
.wx-flake{animation:wxflake 1.7s linear infinite}.wx-flake.f2{animation-delay:.55s}.wx-flake.f3{animation-delay:1.1s}
@keyframes wxbolt{0%,58%,100%{opacity:.22}62%,72%{opacity:1}}
.wx-bolt{animation:wxbolt 1.9s ease-in-out infinite}
@keyframes wxdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(1.1px)}}
.wx-drift{animation:wxdrift 3.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.wx-spin,.wx-spin2,.wx-drop,.wx-flake,.wx-bolt,.wx-drift{animation:none}}</style><h2>Aperçu — icônes météo animées</h2><div class="row"><b>Soleil</b><span class="ic" id="i0"></span><span>24°</span></div><div class="row"><b>Éclaircies</b><span class="ic" id="i2"></span><span>24°</span></div><div class="row"><b>Brouillard</b><span class="ic" id="i45"></span><span>24°</span></div><div class="row"><b>Pluie</b><span class="ic" id="i63"></span><span>24°</span></div><div class="row"><b>Averses</b><span class="ic" id="i81"></span><span>24°</span></div><div class="row"><b>Neige</b><span class="ic" id="i73"></span><span>24°</span></div><div class="row"><b>Orage</b><span class="ic" id="i95"></span><span>24°</span></div><script>
function wxIconSVG(c){ const cl='<path class="wx-drift" d="M7 16.2h8.6a3 3 0 0 0 .3-6A4.4 4.4 0 0 0 7.5 10 2.9 2.9 0 0 0 7 16.2z" fill="#9aa7bd"/>';
  if(c===0) return '<svg class="wxi" viewBox="0 0 24 24" fill="none" stroke="#f4b73e" stroke-width="1.7"><g class="wx-spin"><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="7" y2="7"/><line x1="17" y1="17" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="17" y2="7"/><line x1="7" y1="17" x2="5.2" y2="18.8"/></g><circle cx="12" cy="12" r="4" fill="#f4b73e" stroke="none"/></svg>';
  if(c<=3) return '<svg class="wxi" viewBox="0 0 24 24" fill="none"><g class="wx-spin2"><circle cx="8.5" cy="8" r="2.7" fill="#f4b73e"/></g>'+cl+'</svg>';
  if(c<=48) return '<svg class="wxi" viewBox="0 0 24 24">'+cl+'</svg>';
  if((c>=51&&c<=67)||(c>=80&&c<=82)) return '<svg class="wxi" viewBox="0 0 24 24" stroke="#5b8def" stroke-width="1.7" fill="none">'+cl+'<line class="wx-drop d1" x1="9" y1="17.6" x2="8" y2="20"/><line class="wx-drop d2" x1="12.5" y1="17.6" x2="11.5" y2="20"/><line class="wx-drop d3" x1="16" y1="17.6" x2="15" y2="20"/></svg>';
  if((c>=71&&c<=77)||(c>=85&&c<=86)) return '<svg class="wxi" viewBox="0 0 24 24" fill="#cfe3ff">'+cl+'<circle class="wx-flake f1" cx="9" cy="18.6" r="1.05"/><circle class="wx-flake f2" cx="12.5" cy="18.6" r="1.05"/><circle class="wx-flake f3" cx="16" cy="18.6" r="1.05"/></svg>';
  return '<svg class="wxi" viewBox="0 0 24 24" fill="none">'+cl+'<path class="wx-bolt" d="M12.3 16.3l-2.1 3.6h2.2l-1.3 3.1 3.4-4.3h-2.1l1.2-2.4z" fill="#f4b73e"/></svg>'; }
document.getElementById("i0").innerHTML=wxIconSVG(0);
document.getElementById("i2").innerHTML=wxIconSVG(2);
document.getElementById("i45").innerHTML=wxIconSVG(45);
document.getElementById("i63").innerHTML=wxIconSVG(63);
document.getElementById("i81").innerHTML=wxIconSVG(81);
document.getElementById("i73").innerHTML=wxIconSVG(73);
document.getElementById("i95").innerHTML=wxIconSVG(95);
</script></html>
